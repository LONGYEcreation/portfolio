(()=>{const key='jiali-visual-index-layout-v1',media=matchMedia('(max-width:700px)');let data={};try{data=JSON.parse(localStorage.getItem(key)||'{}')}catch{}const list=document.querySelector('.visual-case-list'),targets=[{node:list,name:'整体内容框',props:{width:'宽度（px）',height:'高度（px）',translateY:'上下位置（px）'}}];[...list.children].forEach((card,i)=>[['.visual-case-number','编号'],['h1,h2','中文'],['p','英文']].forEach(([sel,label])=>targets.push({node:card.querySelector(sel),name:'CASE0'+(i+4)+' '+label,props:{fontSize:'字号',fontWeight:'字重',lineHeight:'行间距',letterSpacing:'字距（px）',marginTop:'上间距（px）',marginBottom:'下间距（px）'}})));const original=targets.map(t=>t.node.getAttribute('style')||''),btn=document.createElement('button'),panel=document.createElement('aside');btn.className='visual-layout-toggle';btn.textContent='调整版式';panel.className='visual-layout-panel';panel.hidden=true;panel.innerHTML='<label>调整对象<select></select></label><div class="fields"></div><button type="button">完成</button><output>同层级版式联动，内容分别修改；手机端与电脑端分别保存。</output>';document.body.append(btn,panel);const select=panel.querySelector('select'),fields=panel.querySelector('.fields'),device=()=>media.matches?'mobile':'desktop';[['整体内容框',0],['编号（04–06 联动）',1],['中文标题（04–06 联动）',2],['英文说明（04–06 联动）',3]].forEach(([name,i])=>select.add(new Option(name,i)));function apply(){targets.forEach((t,i)=>{t.node.setAttribute('style',original[i]);for(const [p,v]of Object.entries(data[device()]?.[i]||{})){if(p==='text')t.node.textContent=v;else if(p==='translateY')t.node.style.transform='translateY('+v+'px)';else t.node.style[p]=['fontWeight','lineHeight','textAlign'].includes(p)?v:v+'px'}})}function set(p,v,index=+select.value){data[device()]??={};const ids=p==='text'||index===0?[index]:[index,index+3,index+6];ids.forEach(i=>{data[device()][i]??={};data[device()][i][p]=v});localStorage.setItem(key,JSON.stringify(data));apply()}const mobileSpacing=document.createElement('fieldset');mobileSpacing.innerHTML='<legend>手机端 · 框内同层级间距</legend>';panel.querySelector('.fields').before(mobileSpacing);const spacingInputs=[];for(const [index,label]of [[1,'编号'],[2,'中文标题'],[3,'英文说明']])for(const prop of ['marginTop','marginBottom']){const row=document.createElement('label'),input=document.createElement('input');row.textContent=label+(prop==='marginTop'?'上间距':'下间距')+' px';input.type='number';input.min=-100;input.max=150;input.step=1;row.append(input);mobileSpacing.append(row);spacingInputs.push({input,index,prop});input.oninput=()=>{if(media.matches&&input.value!=='')set(prop,Math.max(-100,Math.min(150,+input.value)),index)}}function loadSpacing(){mobileSpacing.hidden=!media.matches;if(media.matches)for(const {input,index,prop}of spacingInputs)input.value=data.mobile?.[index]?.[prop]??(parseFloat(getComputedStyle(targets[index].node)[prop])||0)};
function refresh(){loadSpacing();const i=+select.value,t=targets[i],css=getComputedStyle(t.node);fields.replaceChildren();if(i){[i,i+3,i+6].forEach((index,j)=>{const label=document.createElement('label');label.textContent='CASE0'+(j+4)+' 内容';const area=document.createElement('textarea');area.value=targets[index].node.innerText;area.oninput=()=>set('text',area.value,index);fields.append(label,area)})}for(const [p,label]of Object.entries(t.props)){const row=document.createElement('label'),input=document.createElement('input');row.textContent=label;input.type='number';input.step=p==='lineHeight'?.05:1;let v=data[device()]?.[i]?.[p]??(p==='translateY'?0:p==='lineHeight'?parseFloat(css.lineHeight)/parseFloat(css.fontSize):parseFloat(css[p]));input.value=Number.isFinite(v)?Math.round(v*100)/100:1.4;input.oninput=()=>{if(input.value!=='')set(p,+input.value)};row.append(input);fields.append(row)}if(i){const row=document.createElement('label'),align=document.createElement('select');row.textContent='对齐';[['center','居中'],['left','居左'],['right','居右']].forEach(([v,n])=>align.add(new Option(n,v)));align.value=css.textAlign;align.onchange=()=>set('textAlign',align.value);row.append(align);fields.append(row)}}function toggle(open){panel.hidden=!open;document.body.classList.toggle('visual-layout-editing',open);if(open)refresh()}btn.onclick=()=>toggle(panel.hidden);panel.querySelector('button').onclick=()=>toggle(false);select.onchange=refresh;list.addEventListener('click',e=>{if(panel.hidden)return;e.preventDefault();const i=targets.findIndex((t,i)=>i&&t.node.contains(e.target));if(i>0){select.value=((i-1)%3)+1;refresh()}});media.addEventListener('change',()=>{apply();if(!panel.hidden)refresh()});apply()})();
