class="editor-buttons"><button id="saveLayout">保存到网站</button><button id="exportLayout">导出备份</button></div><p class="editor-status" id="layoutStatus" role="status"></p></aside><script src="typography-settings.js"></script><script>
(()=>{
const toggle=document.querySelector('#layoutToggle'),box=document.querySelector('#layoutEditor'),fields=document.querySelector('#editorFields'),select=document.querySelector('#editTarget'),status=document.querySelector('#layoutStatus');const key='jiali-portfolio-layout-v1';
const defaults={left:{cn:'产品思考 & AI构建',en:'PRODUCT THINKING\n&\nAI BUILDING',cnSize:30,cnWeight:900,cnLine:1.35,cnLetter:-.04,enSize:22,enWeight:400,enLine:1.1,enLetter:-.025,gap:22,x:50,y:50},right:{cn:'审美判断 与 视觉体系',en:'AESTHETIC JUDGMENT\n&\nVISUAL SYSTEMS',cnSize:30,cnWeight:900,cnLine:1.35,cnLetter:-.04,enSize:22,enWeight:400,enLine:1.1,enLetter:-.025,gap:22,x:50,y:50},brand:{text:'PORTFOLIO',size:49,weight:400,line:1,letter:-.045},contact:{text:'CONTACT ME',size:15,weight:400,line:1,letter:0}};
let config={...(window.PORTFOLIO_LAYOUT||{})};try{config={...JSON.parse(localStorage.getItem(key)||'{}'),...config}}catch{};let target='left';
const element=k=>document.querySelector(k==='left'?'.product-panel .panel-title':k==='right'?'.creative-panel .panel-title':k==='brand'?'.portfolio-word':'.contact-green');
function initial(k){let d=JSON.parse(JSON.stringify(defaults[k]));const e=element(k);if(k==='left'||k==='right'){const c=getComputedStyle(e.querySelector('.panel-cn')),en=getComputedStyle(e.querySelector('.panel-en'));d.cnSize=Math.round(parseFloat(c.fontSize));d.enSize=Math.round(parseFloat(en.fontSize))}else d.size=Math.round(parseFloat(getComputedStyle(e).fontSize));return d}
const baselines={};Object.keys(defaults).forEach(k=>baselines[k]=initial(k));
function apply(k){const d=config[k];if(!d)return;const e=element(k);if(k==='left'||k==='right'){e.querySelector('.panel-cn').textContent=d.cn;e.querySelector('.panel-en').textContent=d.en.replace(/\\n/g,'\n');[['.panel-cn','cn'],['.panel-en','en']].forEach(([sel,prefix])=>{const t=e.querySelector(sel);t.style.setProperty('font-size','clamp(10px,'+(d[prefix+'Size']/1707*100)+'vw,'+d[prefix+'Size']+'px)','important');t.style.fontWeight=d[prefix+'Weight'];t.style.lineHeight=d[prefix+'Line'];t.style.letterSpacing=d[prefix+'Letter']+'em'});e.style.gap=d.gap+'px';e.style.position='absolute';e.style.left=d.x+'%';e.style.top=d.y+'%';e.style.transform='translate(-50%,-50%)'}else{e.textContent=d.text;e.style.fontSize=d.size+'px';e.style.fontWeight=d.weight;e.style.lineHeight=d.line;e.style.letterSpacing=d.letter+'em';if(k==='contact'){const text=document.createElement('span');text.textContent=d.text;e.replaceChildren(text);const center=()=>{const css=getComputedStyle(text),ctx=document.createElement('canvas').getContext('2d');ctx.font=css.fontStyle+' '+css.fontWeight+' '+css.fontSize+' '+css.fontFamily;const m=ctx.measureText(text.textContent),a=m.fontBoundingBoxAscent??m.actualBoundingBoxAscent,b=m.fontBoundingBoxDescent??m.actualBoundingBoxDescent;text.style.transform='translateY('+((m.actualBoundingBoxAscent-m.actualBoundingBoxDescent-a+b)/2)+'px)'};center();document.fonts.ready.then(center)}}}
function save(){try{localStorage.setItem(key,JSON.stringify(config));status.textContent='已保存在此浏览器'}catch{status.textContent='当前浏览器无法保存，请导出设置'}}
function textarea(name,label,value){return '<label>'+label+'<textarea data-prop="'+name+'">'+escapeText(value.replace(/\\n/g,'\n'))+'</textarea></label>'}
function escapeText(v){return String(v).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function number(name,label,val,min,max,step){return '<label>'+label+'<input type="number" data-prop="'+name+'" value="'+val+'" min="'+min+'" max="'+max+'" step="'+step+'"></label>'}
function weight(name,label,val){return '<label>'+label+'<select data-prop="'+name+'">'+[100,200,300,400,500,600,700,800,900].map(n=>'<option value="'+n+'" '+(Number(val)===n?'selected':'')+'>'+n+'</option>').join('')+'</select></label>'}
function render(){const d=config[target]||baselines[target];if(target==='left'||target==='right'){fields.innerHTML=textarea('cn','中文内容 / 回车换行',d.cn)+'<div class="edit-two">'+number('cnSize','中文字号 px',d.cnSize,8,180,1)+weight('cnWeight','中文字重',d.cnWeight)+number('cnLine','中文行距（倍）',d.cnLine,.5,4,.05)+number('cnLetter','中文字距 em',d.cnLetter,-.2,1,.01)+'</div>'+textarea('en','英文内容 / 回车换行',d.en)+'<div class="edit-two">'+number('enSize','英文字号 px',d.enSize,8,180,1)+weight('enWeight','英文字重',d.enWeight)+number('enLine','英文行距（倍）',d.enLine,.5,4,.05)+number('enLetter','英文字距 em',d.enLetter,-.2,1,.01)+'</div>'+number('gap','中英文间距 px',d.gap,0,180,1)+'<details><summary>标题位置</summary><div class="edit-two">'+number('x','横向位置 %',d.x,0,100,1)+number('y','纵向位置 %',d.y,0,100,1)+'</div></details>'}else fields.innerHTML=textarea('text','文字内容',d.text)+'<div class="edit-two">'+number('size','字号 px',d.size,8,180,1)+weight('weight','字重',d.weight)+number('line','行距（倍）',d.line,.5,4,.05)+number('letter','字距 em',d.letter,-.2,1,.01)+'</div>';fields.querySelectorAll('[data-prop]').forEach(input=>input.addEventListener('input',()=>{const prop=input.dataset.prop;let value=input.value;if(!['cn','en','text'].includes(prop)){value=Number(value);if(!Number.isFinite(value)||input.value==='')return;if(input.min!==undefined&&input.min!=='')value=Math.max(Number(input.min),value);if(input.max!==undefined&&input.max!=='')value=Math.min(Number(input.max),value)}if(!config[target])config[target]={...baselines[target]};config[target][prop]=value;apply(target);save()}))}
Object.keys(config).filter(k=>defaults[k]).forEach(apply);render();document.querySelector('#saveLayout').onclick=async()=>{const b=document.querySelector('#saveLayout');b.disabled=true;status.textContent='正在保存…';try{const r=await fetch('/api/layout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({settings:config})});if(!r.ok)throw Error('保存接口返回 '+r.status);const result=await r.json();if(!result.saved)throw Error('接口未确认保存');status.textContent='已保存到网站文件 · '+new Date().toLocaleTimeString('zh-CN');}catch(error){status.textContent='保存失败：'+error.message+'。浏览器草稿仍保留。';}finally{b.disabled=false}};toggle.onclick=()=>{box.hidden=!box.hidden;toggle.textContent=box.hidden?'调整排版':'收起面板'};document.querySelector('#closeLayout').onclick=()=>{box.hidden=true;toggle.textContent='调整排版'};select.onchange=()=>{target=select.value;status.textContent='';render()};document.querySelector('#exportLayout').onclick=()=>{const data={description:'陈佳立作品集排版设置',viewport:{width:innerWidth,height:innerHeight},settings:config};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='portfolio-typography.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);status.textContent='已导出，可将文件发给我落实到网站。'};
})();

(()=>{function wrapLines(el){if(!el)return;const text=el.innerText;const lines=text.split(/\n/);const frag=document.createDocumentFragment();lines.forEach(line=>{const span=document.createElement('span');span.className='title-line';span.textContent=line.trim()||'\u00a0';if(line.trim()==='审美评测')span.setAttribute('data-aesthetic-line','');frag.appendChild(span)});el.replaceChildren(frag)}document.querySelectorAll('.panel-cn,.panel-en').forEach(el=>{wrapLines(el);new MutationObserver(changes=>{if(changes.some(c=>Array.from(c.addedNodes).some(n=>n.nodeType===3||n.nodeType===1&&!n.classList.contains('title-line'))))wrapLines(el)}).observe(el,{childList:true})})})();
</script><style>@media(max-width:700px){.split-nav,.profile-shortcut{position:relative;pointer-events:auto;z-index:2}.split-nav:before,.profile-shortcut:before{content:'';position:absolute;inset:-14px -8px;z-index:-1}.split-nav>button,.profile-shortcut>a{position:relative}.split-nav>button:before,.profile-shortcut>a:before{content:'';position:absolute;inset:-14px -8px}}</style><script>(()=>{for(const [selector,url] of [['.split-nav','work.html'],['.profile-shortcut','about.html']])document.querySelector(selector)?.addEventListener('click',event=>{if(innerWidth>700)return;event.preventDefault();event.stopPropagation();location.href=url},true)})();</script><style id="home-touch-entry-style">@media(max-width:700px){
.image-panel.home-touch-opening img{transform:scale(1.035)!important;transition:transform .45s ease!important}
.image-panel.home-touch-opening .panel-cn .title-line:after{clip-path:inset(0 0 0 0)!important;transition:clip-path .4s cubic-bezier(.2,.65,.3,1)!important}
}</style><script>(()=>{
let lastTouch=-Infinity,busy=false;
addEventListener('touchend',()=>lastTouch=performance.now(),{passive:true});
document.addEventListener('click',event=>{
 if(innerWidth>700||!(event.pointerType==='touch'||event.sourceCapabilities?.firesTouchEvents===true||performance.now()-lastTouch<900))return;
 const panel=event.target.closest('.image-panel');if(!panel)return;
 if(event.target.closest('.split-header,.profile-shortcut,.split-nav,.portfolio-word,.layout-editor'))return;
 event.preventDefault();event.stopImmediatePropagation();if(busy)return;busy=true;
 panel.classList.add('home-touch-opening');
 const url=panel.classList.contains('product-panel')?'product-fundamentals.html':'visual-systems.html';
 setTimeout(()=>location.href=url,matchMedia('(prefers-reduced-motion:reduce)').matches?0:480);
},true);
addEventListener('pageshow',()=>{busy=false;document.querySelectorAll('.home-touch-opening').forEach(node=>node.classList.remove('home-touch-opening'))});
})();</script></body></html>
