const cases={chatcut:`<span class="status-label">独立产品体验研究 / 初步假设与概念方案</span><h2>ChatCut：从首次生成到持续创作</h2><p>研究目标：观察新用户从认识产品到首次创作的关键路径，识别价值表达、功能理解和持续探索中的潜在障碍。</p><p class="notice">基于个人首次实际体验，尚未获得内部行为数据、研发约束与团队设计预期。以下结论不代表普遍用户行为，也不代表已实施的产品优化。</p><h3>01 / 从完整路径中收敛重点</h3><p>覆盖搜索页、官网、编辑器、首次 Credits 生成及后续编辑，记录 10 项潜在优化机会。最终重点聚焦生成后的局部编辑，以及操作前的成本预期。</p><h3>02 / 一次测试修正了问题定义</h3><div class="evidence"><div><strong>最初观察</strong>找不到直观的遮罩调色方式，考虑是否需要增加手动编辑能力。</div><div><strong>补充实测</strong>指令“仅将结尾米色遮罩改为黑色”，修改成功，记录消耗 4.1 Credits。</div><div><strong>判断收敛</strong>先研究能力发现、成本预期与编辑边界，再判断是否需要新增编辑方式。</div></div><h3>03 / 优化方案：让下一步可理解</h3><p>围绕选中片段、明确修改范围、查看成本提示、执行前确认、前后对比与撤销，制作局部编辑概念原型。直接调色作为待验证的对照方案。</p><p><a href="chatcut-prototype.html" target="_blank" style="border-bottom:1px solid">打开可交互概念原型 ↗</a></p><p class="notice">原型为本地模拟，不调用 ChatCut。费用区间、内容锁定与版本恢复是设计假设，不代表真实产品规则或能力。</p><h3>04 / 差异化视角：从质量判断到场景机会</h3><p>本次白底产品图生成体验中，光影、运镜、景别、转场与配乐的组织效果超出预期。因此提出“产品白底图 → 广告视频”的具体场景机会，后续需要验证质量稳定性、目标人群需求及使用频率。</p><h3>05 / 下一步验证</h3><p>以小范围任务测试观察功能发现、范围与成本理解、完成时间、求助与错误操作。真实修改成功率、误改内容和实际 Credits 消耗需要在真实产品中另行验证。当前未开展用户测试，未产生效果提升数据。</p>`,nitunxiang:`<span class="status-label">官网实践已完成 / 产品化与商业假设待验证</span><h2>泥吞象：从品牌官网实践到产品机会</h2><h3>01 / 业务问题</h3><p>社媒传播与线下寄售形成分散触点，品牌需要自主控制的统一入口，承接品牌认知、产品探索与后续行动。由此提出官方独立站方案。</p><h3>02 / 我的角色与工作流</h3><p>作为品牌与业务 Owner，承担需求、品牌、信息架构与体验判断，借助 Codex 完成工程实现，并通过可运行原型进行评估与迭代。</p><img src="assets/portfolio8.png" alt="泥吞象 AI 工作流与传统协作对比"><h3>03 / 实践发现</h3><p>AI 补足了个人工程执行能力，也缩短了目标判断到原型之间的反馈链路。但这次个人跑通的经验，尚不能证明不同用户都能稳定复现。</p><h3>04 / 产品机会假设</h3><p>当执行能力更易获取，品牌、业务、信息架构与交互判断仍然影响结果。由此提出判断辅助型建站产品：通过结构化业务问答，帮助用户形成约束，再交给 AI 执行。</p><h3>05 / 验证边界</h3><p>官网建设与个人工作流实践，与面向其他用户的产品成立是两个层次。跨品牌复现、需求频率、付费意愿、成本与市场规模仍待验证。</p><p><a href="https://nitunxiang.com" target="_blank" rel="noopener" style="border-bottom:1px solid">访问官网 ↗</a></p>`,bananain:`<span class="status-label">品牌创意实践 / 阶段性工作流沉淀</span><h2>蕉内：让抽象的品牌判断可讨论</h2><h3>01 / 任务背景</h3><p>在成熟品牌组织中推进 AI 品牌创意短片实验，从品牌定位、创意框架到脚本分镜，用具体 demo 支持讨论与迭代。</p><h3>02 / 品牌判断如何外显</h3><p>依据品牌关键词搜集不同方向的参考，通过“符合 / 不符合”的反馈提取气质核心，再将叙事共性转化为结构和约束。AI demo 用于验证团队是否对同一判断形成共识。</p><h3>03 / 从品牌到创意工作流</h3><p>以真实产品与卖点为输入，连接生活场景、品牌叙事、调性检查与产品内核检查，避免创意脱离业务目标。再通过分镜、人物气质与试衣 demo 推进对齐。</p><img src="assets/portfolio19.png" alt="AI demo 介入品牌创意对齐的流程"><h3>04 / 对 AI 产品的启发</h3><p>除了生成结果，产品还可以帮助团队定义标准、比较候选、表达反馈与保留共识。创作判断需要结合品牌目标，评价体系也应明确任务语境。</p><h3>05 / 阶段与边界</h3><p>现有材料记录了品牌拆解、创意框架与 AI demo 实践；技术调研、生成迭代与后续投放复盘处于不同阶段。当前不主张已经取得投放效果或系统性评测结果。</p>`};

const aboutHTML='<section id="about" class="section"><div class="section-head"><div class="num en">03</div><h2>关于我<span class="en">Across Disciplines, Toward Products</span></h2><p>从创作者、品牌主理人到 AI 实践者，持续在业务目标与创作结果之间定义问题、协调资源并推动落地。</p></div><div class="about"><div><h3>陈佳立 <span class="en">Jiali Chen</span></h3><p>我的经历覆盖自主创作、独立品牌建设与成熟品牌组织协作。不同角色让我看到：同一项创作任务，在不同业务背景下，成功的标准并不相同。</p><p>我希望把这种对场景、目标与质量的理解，带入 AI 产品定义、交互设计与生成结果判断。</p><div class="links"><a href="assets/resume.pdf" target="_blank">完整经历与联系方式 ↗</a></div></div><div><div class="history"><span>BUSINESS</span><div>泥吞象 NITUNXIANG<br>创始人 / 品牌主理人</div></div><div class="history"><span>BRAND</span><div>蕉内 BANANAIN<br>品牌设计 / AI 品牌创意实践</div></div><div class="history"><span>2022–2024</span><div>英国皇家艺术学院<br>信息体验设计 · 硕士</div></div><div class="history"><span>2018–2022</span><div>中央美术学院<br>视觉传达设计 · 学士</div></div></div></div></section>';
const contactHTML='<section class="contact-panel" id="contact"><div class="eyebrow">GET IN TOUCH</div><h2>Let’s make it happen.</h2><p>AI 产品岗位求职 · 欢迎交流产品、创作与新的可能。</p><div class="contact-actions"><span>微信 / <span id="wechatId">lsloonxa</span></span><button id="copyWechat">复制微信号 ↗</button><a href="assets/resume.pdf" target="_blank">查看简历与联系方式 ↗</a></div><p id="copyStatus" role="status" style="min-height:24px;font-size:12px"></p></section>';
const creativeHTML='<figure><img src="assets/portfolio21.png" alt="风格建构" loading="lazy"><figcaption>风格建构</figcaption></figure><figure><img src="assets/portfolio22.png" alt="主题演绎" loading="lazy"><figcaption>主题演绎</figcaption></figure><figure><img src="assets/portfolio23.png" alt="品牌建设" loading="lazy"><figcaption>品牌建设</figcaption></figure><figure><img src="assets/portfolio24.png" alt="品牌概念" loading="lazy"><figcaption>品牌概念</figcaption></figure>';

const landing=document.querySelector('#landing'),workspace=document.querySelector('#workspace'),reader=document.querySelector('#reader'),content=document.querySelector('#content');
function overview(type){const all=[['chatcut','ChatCut','产品体验研究与优化','<div class="plain-thumb">从首次生成，<br>到持续创作。</div>'],['nitunxiang','泥吞象品牌官网','真实业务实践与产品机会','<img src="assets/portfolio8.png" alt="泥吞象工作流">'],['bananain','蕉内 AI 品牌创意','品牌判断结构化与组织对齐','<img src="assets/portfolio19.png" alt="蕉内创意工作流">'],['creative','精选创作','品牌与独立创作','<img src="assets/portfolio21.png" alt="精选创作">']];let items=type==='product'?all.slice(0,2):type==='advantage'?all.slice(2):all;return '<h1>'+({product:'产品基础能力',advantage:'品牌／交互／审美优势',works:'作品'})[type]+'</h1><div class="page-label">SELECTED WORKS / JIALI CHEN</div><div class="overview-grid">'+items.map(x=>'<button class="overview-item" data-route="'+x[0]+'"><div class="thumb">'+x[3]+'</div><h2>'+x[1]+'</h2><p>'+x[2]+'</p></button>').join('')+'</div>'}
function route(id,push=true){if(!['works','product','advantage','chatcut','nitunxiang','bananain','creative','about','contact'].includes(id))id='works';landing.hidden=true;workspace.hidden=false;const group=['about','contact'].includes(id)?id:'works';document.querySelectorAll('[data-route]').forEach(b=>{b.classList.toggle('active',b.dataset.route===id);if(b.dataset.route===id)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});document.querySelectorAll('[data-group]').forEach(b=>b.classList.toggle('active',b.dataset.group===group));if(cases[id])content.innerHTML='<article class="modal-body">'+cases[id]+'</article>';else if(id==='about')content.innerHTML='<h1>简介</h1><div class="page-label">ABOUT / JIALI CHEN</div>'+aboutHTML;else if(id==='contact')content.innerHTML=contactHTML;else if(id==='creative')content.innerHTML='<h1>精选创作</h1><div class="page-label">BRAND & INDEPENDENT CREATION</div><div class="gallery">'+creativeHTML+'</div>';else content.innerHTML=overview(id);reader.scrollTop=0;if(push)history.pushState({page:id},'', '#'+id);document.title=({works:'作品',product:'产品基础能力',advantage:'品牌与审美',chatcut:'ChatCut',nitunxiang:'泥吞象',bananain:'蕉内',creative:'精选创作',about:'简介',contact:'联系'})[id]+' · 陈佳立';const copy=content.querySelector('#copyWechat');if(copy)copy.onclick=async()=>{try{await navigator.clipboard.writeText('lsloonxa');content.querySelector('#copyStatus').textContent='微信号已复制。'}catch{content.querySelector('#copyStatus').textContent='请手动复制：lsloonxa'}}}
document.addEventListener('click',e=>{const button=e.target.closest('[data-route]');if(button)route(button.dataset.route)});document.querySelector('#homeButton').onclick=()=>route('works');window.addEventListener('popstate',()=>{const id=location.hash.slice(1);if(id&&id!=='home')route(id,false);else route('works',false)});const initial=location.hash.slice(1);if(initial&&initial!=='home')route(initial,false);else route('works',false)

route(['works','product','advantage','chatcut','nitunxiang','bananain','creative','about','contact'].includes(location.hash.slice(1))?location.hash.slice(1):'works',false);</script></body></html>
